<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
  <title id="t">Nested shells</title>
  <desc id="d">Four nested pit cross-sections for revenue factors 1.0 to 0.35; a block shell is its smallest factor; inner shells are mined first.</desc>
  <style>
    :root { --bg:#ffffff; --card:#f6f8fa; --ink:#1f2328; --muted:#59636e; --line:#d0d7de;
            --a:#0969da; --b:#8250df; --c:#1a7f37; --d:#9a6700; --e:#cf222e;
            --a2:#ddf4ff; --b2:#fbefff; --c2:#dafbe1; --d2:#fff8c5; --e2:#ffebe9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --card:#151b23; --ink:#f0f6fc; --muted:#aab4c0; --line:#3d444d;
              --a:#58a6ff; --b:#bc8cff; --c:#3fb950; --d:#e3b341; --e:#ff7b72;
              --a2:#0c2d6b; --b2:#3c1e70; --c2:#04260f; --d2:#3b2300; --e2:#490202; }
    }
    .bg { fill:var(--bg); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .t { fill:var(--ink); font:600 15px system-ui, -apple-system, Segoe UI, sans-serif; }
    .h { fill:var(--ink); font:600 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    .s { fill:var(--muted); font:12px system-ui, -apple-system, Segoe UI, sans-serif; }
    .m { fill:var(--ink); font:12px ui-monospace, Consolas, monospace; }
    .ms { fill:var(--muted); font:11px ui-monospace, Consolas, monospace; }
    .ln { stroke:var(--line); stroke-width:1.5; fill:none; }
    .lnd { stroke:var(--muted); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .ar { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#ah); }
    .ara { stroke:var(--a); stroke-width:1.8; fill:none; marker-end:url(#aha); }
    .fa { fill:var(--a2); stroke:var(--a); stroke-width:1.2; }
    .fb { fill:var(--b2); stroke:var(--b); stroke-width:1.2; }
    .fc { fill:var(--c2); stroke:var(--c); stroke-width:1.2; }
    .fd { fill:var(--d2); stroke:var(--d); stroke-width:1.2; }
    .fe { fill:var(--e2); stroke:var(--e); stroke-width:1.2; }
    .fw { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .ka { fill:var(--a); } .kb { fill:var(--b); } .kc { fill:var(--c); } .kd { fill:var(--d); } .ke { fill:var(--e); }
    .sa { stroke:var(--a); } .sb { stroke:var(--b); } .sc { stroke:var(--c); } .sd { stroke:var(--d); } .se { stroke:var(--e); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--a)"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="800" height="330" rx="10"/>
  <text x="400" y="30" class="t" text-anchor="middle">Nested shells: revenue factors become the pushback order</text>
  <path d="M50.0 70 L470.0 70 L344.0 280 L176.0 280 Z" class="fw"/>
  <text x="260" y="270" class="ms" text-anchor="middle">revenue factor 1.00</text>
  <path d="M95.0 70 L425.0 70 L326.0 235 L194.0 235 Z" class="fd"/>
  <text x="260" y="225" class="ms" text-anchor="middle">revenue factor 0.80</text>
  <path d="M140.0 70 L380.0 70 L308.0 190 L212.0 190 Z" class="fb"/>
  <text x="260" y="180" class="ms" text-anchor="middle">revenue factor 0.60</text>
  <path d="M185.0 70 L335.0 70 L290.0 145 L230.0 145 Z" class="fa"/>
  <text x="260" y="135" class="ms" text-anchor="middle">revenue factor 0.35</text>
  <text x="260" y="310" class="s" text-anchor="middle">a lower price can only shrink the optimal pit, so the pits nest</text>
  <rect x="560" y="80" width="220" height="64" rx="8" class="fw"/>
  <text x="670.0" y="95.0" class="h" text-anchor="middle">shell of a block</text>
  <text x="670.0" y="112.0" class="s" text-anchor="middle">the smallest revenue factor</text>
  <text x="670.0" y="127.0" class="s" text-anchor="middle">at which it is still in the pit</text>
  <rect x="560" y="170" width="220" height="64" rx="8" class="fw"/>
  <text x="670.0" y="185.0" class="h" text-anchor="middle">mine inner shells first</text>
  <text x="670.0" y="202.0" class="s" text-anchor="middle">the same TopoSort walk</text>
  <text x="670.0" y="217.0" class="s" text-anchor="middle">and capacities as every rung</text>
  <path d="M670 146 L670 168" class="ar"/>
  <text x="670" y="262" class="s" text-anchor="middle">the most favourable reading:</text>
  <text x="670" y="278" class="s" text-anchor="middle">every shell, no manual step</text>

</svg>
