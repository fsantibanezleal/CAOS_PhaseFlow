<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 304" role="img" aria-labelledby="t d">
  <title id="t">Minimum width smoothing</title>
  <desc id="d">One bench before and after smoothing: slivers absorbed into the majority neighbour period under precedence and capacity.</desc>
  <style>
    :root { --bg:#ffffff; --card:#f6f8fa; --ink:#1f2328; --muted:#59636e; --line:#d0d7de;
            --a:#0969da; --b:#8250df; --c:#1a7f37; --d:#9a6700; --e:#cf222e;
            --a2:#ddf4ff; --b2:#fbefff; --c2:#dafbe1; --d2:#fff8c5; --e2:#ffebe9; }
