<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" role="img" aria-labelledby="t d">
  <title id="t">UPIT, CPIT and PCPSP</title>
  <desc id="d">Three cards: UPIT decides which blocks, CPIT adds time, PCPSP adds destinations; the feasible sets nest, with the newman1 and a small twin as examples.</desc>
  <style>
    :root { --bg:#ffffff; --card:#f6f8fa; --ink:#1f2328; --muted:#59636e; --line:#d0d7de;
            --a:#0969da; --b:#8250df; --c:#1a7f37; --d:#9a6700; --e:#cf222e;
            --a2:#ddf4ff; --b2:#fbefff; --c2:#dafbe1; --d2:#fff8c5; --e2:#ffebe9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --card:#151b23; --ink:#f0f6fc; --muted:#aab4c0; --line:#3d444d;
              --a:#58a6ff; --b:#bc8cff; --c:#3fb950; --d:#e3b341; --e:#ff7b72;
              --a2:#0c2d6b; --b2:#3c1e70; --c2:#04260f; --d2:#3b2300; --e2:#490202; }
    }
    .bg { fill:var(--bg); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .t { fill:var(--ink); font:600 15px system-ui, -apple-system, Segoe UI, sans-serif; }
    .h { fill:var(--ink); font:600 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    .s { fill:var(--muted); font:12px system-ui, -apple-system, Segoe UI, sans-serif; }
    .m { fill:var(--ink); font:12px ui-monospace, Consolas, monospace; }
    .ms { fill:var(--muted); font:11px ui-monospace, Consolas, monospace; }
    .ln { stroke:var(--line); stroke-width:1.5; fill:none; }
    .lnd { stroke:var(--muted); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .ar { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#ah); }
    .ara { stroke:var(--a); stroke-width:1.8; fill:none; marker-end:url(#aha); }
    .fa { fill:var(--a2); stroke:var(--a); stroke-width:1.2; }
    .fb { fill:var(--b2); stroke:var(--b); stroke-width:1.2; }
    .fc { fill:var(--c2); stroke:var(--c); stroke-width:1.2; }
    .fd { fill:var(--d2); stroke:var(--d); stroke-width:1.2; }
    .fe { fill:var(--e2); stroke:var(--e); stroke-width:1.2; }
    .fw { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .ka { fill:var(--a); } .kb { fill:var(--b); } .kc { fill:var(--c); } .kd { fill:var(--d); } .ke { fill:var(--e); }
    .sa { stroke:var(--a); } .sb { stroke:var(--b); } .sc { stroke:var(--c); } .sd { stroke:var(--d); } .se { stroke:var(--e); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--a)"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="352" rx="10"/>
  <text x="450" y="30" class="t" text-anchor="middle">Four problems, nested by what they decide</text>
  <rect x="30" y="55" width="250" height="120" rx="8" class="fw"/>
  <text x="155.0" y="90.5" class="h" text-anchor="middle">UPIT</text>
  <text x="155.0" y="107.5" class="s" text-anchor="middle">which blocks are worth mining</text>
  <text x="155.0" y="122.5" class="s" text-anchor="middle">max closure: polynomial</text>
  <text x="155.0" y="137.5" class="s" text-anchor="middle">no time, no capacity</text>
  <rect x="325" y="55" width="250" height="120" rx="8" class="fa"/>
  <text x="450.0" y="90.5" class="h" text-anchor="middle">CPIT</text>
  <text x="450.0" y="107.5" class="s" text-anchor="middle">WHEN to mine each block</text>
  <text x="450.0" y="122.5" class="s" text-anchor="middle">precedence in every period,</text>
  <text x="450.0" y="137.5" class="s" text-anchor="middle">capacities, discounting; NP-hard</text>
  <rect x="620" y="55" width="250" height="120" rx="8" class="fb"/>
  <text x="745.0" y="90.5" class="h" text-anchor="middle">PCPSP / OPBSP</text>
  <text x="745.0" y="107.5" class="s" text-anchor="middle">when AND where each block goes</text>
  <text x="745.0" y="122.5" class="s" text-anchor="middle">the cutoff grade is an output</text>
  <text x="745.0" y="137.5" class="s" text-anchor="middle">destination per block; NP-hard</text>
  <path d="M282 115 L322 115" class="ar"/>
  <text x="302" y="105" class="ms" text-anchor="middle">time</text>
  <path d="M577 115 L617 115" class="ar"/>
  <text x="597" y="105" class="ms" text-anchor="middle">dest.</text>
  <text x="30" y="210" class="s" text-anchor="start">Inclusion: every CPIT plan is a PCPSP plan of the same value, so the PCPSP optimum and LP are never below the CPIT ones.</text>
  <rect x="30" y="228" width="840" height="112" rx="8" class="card"/>
  <text x="50" y="252" class="h" text-anchor="start">newman1 (published)</text>
  <text x="50" y="274" class="m" text-anchor="start">CPIT LP 24,486,184 · PCPSP LP 24,486,549</text>
  <text x="50" y="294" class="s" text-anchor="start">365 apart: the destination freedom is worth almost nothing here</text>
  <text x="470" y="252" class="h" text-anchor="start">a plant-bound twin, 320 blocks, solved exactly</text>
  <text x="470" y="274" class="m" text-anchor="start">CPIT 6.53 M · OPBSP 10.37 M · PCPSP LP 11.01 M</text>
  <text x="470" y="294" class="s" text-anchor="start">choosing destinations is worth about 59 percent</text>
  <text x="450" y="326" class="s" text-anchor="middle">which bound scores a plan follows from which problem the plan solves</text>

</svg>
