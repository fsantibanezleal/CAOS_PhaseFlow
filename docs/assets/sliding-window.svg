<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 332" role="img" aria-labelledby="t d">
  <title id="t">Sliding time window</title>
  <desc id="d">Eight periods: the first fixed, a three-period window solved exactly, the rest aggregated into a tail; candidates chosen by LP expected time.</desc>
  <style>
    :root { --bg:#ffffff; --card:#f6f8fa; --ink:#1f2328; --muted:#59636e; --line:#d0d7de;
            --a:#0969da; --b:#8250df; --c:#1a7f37; --d:#9a6700; --e:#cf222e;
            --a2:#ddf4ff; --b2:#fbefff; --c2:#dafbe1; --d2:#fff8c5; --e2:#ffebe9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --card:#151b23; --ink:#f0f6fc; --muted:#aab4c0; --line:#3d444d;
              --a:#58a6ff; --b:#bc8cff; --c:#3fb950; --d:#e3b341; --e:#ff7b72;
              --a2:#0c2d6b; --b2:#3c1e70; --c2:#04260f; --d2:#3b2300; --e2:#490202; }
    }
    .bg { fill:var(--bg); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .t { fill:var(--ink); font:600 15px system-ui, -apple-system, Segoe UI, sans-serif; }
    .h { fill:var(--ink); font:600 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    .s { fill:var(--muted); font:12px system-ui, -apple-system, Segoe UI, sans-serif; }
    .m { fill:var(--ink); font:12px ui-monospace, Consolas, monospace; }
    .ms { fill:var(--muted); font:11px ui-monospace, Consolas, monospace; }
    .ln { stroke:var(--line); stroke-width:1.5; fill:none; }
    .lnd { stroke:var(--muted); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .ar { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#ah); }
    .ara { stroke:var(--a); stroke-width:1.8; fill:none; marker-end:url(#aha); }
    .fa { fill:var(--a2); stroke:var(--a); stroke-width:1.2; }
    .fb { fill:var(--b2); stroke:var(--b); stroke-width:1.2; }
    .fc { fill:var(--c2); stroke:var(--c); stroke-width:1.2; }
    .fd { fill:var(--d2); stroke:var(--d); stroke-width:1.2; }
    .fe { fill:var(--e2); stroke:var(--e); stroke-width:1.2; }
    .fw { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .ka { fill:var(--a); } .kb { fill:var(--b); } .kc { fill:var(--c); } .kd { fill:var(--d); } .ke { fill:var(--e); }
    .sa { stroke:var(--a); } .sb { stroke:var(--b); } .sc { stroke:var(--c); } .sd { stroke:var(--d); } .se { stroke:var(--e); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--a)"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="332" rx="10"/>
  <text x="450" y="30" class="t" text-anchor="middle">The sliding time window: solve three periods jointly, keep one, slide</text>
  <rect x="40" y="70" width="96" height="50" rx="6" class="fc"/>
  <text x="88" y="92" class="m" text-anchor="middle">period 1</text>
  <text x="88" y="110" class="ms" text-anchor="middle">fixed</text>
  <rect x="144" y="70" width="96" height="50" rx="6" class="fa"/>
  <text x="192" y="100" class="m" text-anchor="middle">period 2</text>
  <rect x="248" y="70" width="96" height="50" rx="6" class="fa"/>
  <text x="296" y="100" class="m" text-anchor="middle">period 3</text>
  <rect x="352" y="70" width="96" height="50" rx="6" class="fw"/>
  <text x="400" y="100" class="m" text-anchor="middle">period 4</text>
  <rect x="456" y="70" width="96" height="50" rx="6" class="fw"/>
  <text x="504" y="100" class="m" text-anchor="middle">period 5</text>
  <rect x="560" y="70" width="96" height="50" rx="6" class="fw"/>
  <text x="608" y="100" class="m" text-anchor="middle">period 6</text>
  <rect x="664" y="70" width="96" height="50" rx="6" class="fw"/>
  <text x="712" y="100" class="m" text-anchor="middle">period 7</text>
  <rect x="768" y="70" width="96" height="50" rx="6" class="fw"/>
  <text x="816" y="100" class="m" text-anchor="middle">period 8</text>
  <path d="M40 140 L352 140" class="ara"/>
  <text x="196" y="160" class="s" text-anchor="middle">window: an exact MILP (HiGHS) on cumulative binaries</text>
  <path d="M352 64 L872 64" class="lnd"/>
  <text x="612" y="56" class="s" text-anchor="middle">tail: the remaining periods as ONE slot, optimistic discount</text>
  <rect x="40" y="210" width="400" height="80" rx="8" class="fw"/>
  <text x="240.0" y="225.5" class="h" text-anchor="middle">candidates for the window</text>
  <text x="240.0" y="242.5" class="s" text-anchor="middle">the undecided blocks ordered by the LP expected time E_b,</text>
  <text x="240.0" y="257.5" class="s" text-anchor="middle">taken until they cover 1.6 window capacities;</text>
  <text x="240.0" y="272.5" class="s" text-anchor="middle">closed under precedence because E_a &lt;= E_b on every arc</text>
  <rect x="470" y="210" width="400" height="80" rx="8" class="fw"/>
  <text x="670.0" y="225.5" class="h" text-anchor="middle">then slide one period</text>
  <text x="670.0" y="242.5" class="s" text-anchor="middle">the fixed period never changes again;</text>
  <text x="670.0" y="257.5" class="s" text-anchor="middle">everything after it is released and re-planned</text>
  <text x="670.0" y="272.5" class="s" text-anchor="middle">on the next slide</text>
  <text x="450" y="316" class="s" text-anchor="middle">the look-ahead: a block worth mining now only for what it unlocks later is visible to the solver</text>

</svg>
