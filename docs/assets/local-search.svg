  <text x="176" y="248" class="s" text-anchor="middle">digits: period of each block; highlighted: the set D</text>
  <rect x="360" y="60" width="400" height="60" rx="8" class="fw"/>
  <text x="560.0" y="80.5" class="h" text-anchor="middle">the free blocks of D get period variables</text>
  <text x="560.0" y="97.5" class="s" text-anchor="middle">up to 180 blocks; three ways to build D</text>
  <rect x="360" y="136" width="400" height="60" rx="8" class="fw"/>
  <text x="560.0" y="156.5" class="h" text-anchor="middle">fixed predecessors: floors; fixed successors: ceilings</text>
  <text x="560.0" y="173.5" class="s" text-anchor="middle">the capacity the fixed blocks use is subtracted</text>
  <rect x="360" y="212" width="400" height="60" rx="8" class="fc"/>
  <text x="560.0" y="232.5" class="h" text-anchor="middle">accept only a proven improvement</text>
  <text x="560.0" y="249.5" class="s" text-anchor="middle">relative MIP gap 1e-4, never a time limit</text>
  <text x="400" y="300" class="s" text-anchor="middle">the shift search moves one block at a time; this moves a block together with its cone</text>

