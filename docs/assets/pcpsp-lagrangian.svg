<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" role="img" aria-labelledby="t d">
  <title id="t">The PCPSP bound by its Lagrangian dual</title>
  <desc id="d">Left: each block and period takes its best destination at the capacity prices. Middle: the extraction is one maximum closure on the time-expanded graph. Right: a trust-region cutting-plane loop moves the prices; a stopping rule is recorded with the bound.</desc>
  <style>
    :root { --bg:#ffffff; --card:#f6f8fa; --ink:#1f2328; --muted:#59636e; --line:#d0d7de;
            --a:#0969da; --b:#8250df; --c:#1a7f37; --d:#9a6700; --e:#cf222e;
            --a2:#ddf4ff; --b2:#fbefff; --c2:#dafbe1; --d2:#fff8c5; --e2:#ffebe9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --card:#151b23; --ink:#f0f6fc; --muted:#aab4c0; --line:#3d444d;
              --a:#58a6ff; --b:#bc8cff; --c:#3fb950; --d:#e3b341; --e:#ff7b72;
              --a2:#0c2d6b; --b2:#3c1e70; --c2:#04260f; --d2:#3b2300; --e2:#490202; }
    }
    .bg { fill:var(--bg); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .t { fill:var(--ink); font:600 15px system-ui, -apple-system, Segoe UI, sans-serif; }
    .h { fill:var(--ink); font:600 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    .s { fill:var(--muted); font:12px system-ui, -apple-system, Segoe UI, sans-serif; }
    .m { fill:var(--ink); font:12px ui-monospace, Consolas, monospace; }
    .ms { fill:var(--muted); font:11px ui-monospace, Consolas, monospace; }
    .ln { stroke:var(--line); stroke-width:1.5; fill:none; }
    .lnd { stroke:var(--muted); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .ar { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#ah); }
    .ara { stroke:var(--a); stroke-width:1.8; fill:none; marker-end:url(#aha); }
    .fa { fill:var(--a2); stroke:var(--a); stroke-width:1.2; }
    .fb { fill:var(--b2); stroke:var(--b); stroke-width:1.2; }
    .fc { fill:var(--c2); stroke:var(--c); stroke-width:1.2; }
    .fd { fill:var(--d2); stroke:var(--d); stroke-width:1.2; }
    .fe { fill:var(--e2); stroke:var(--e); stroke-width:1.2; }
    .fw { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .ka { fill:var(--a); } .kb { fill:var(--b); } .kc { fill:var(--c); } .kd { fill:var(--d); } .ke { fill:var(--e); }
    .sa { stroke:var(--a); } .sb { stroke:var(--b); } .sc { stroke:var(--c); } .sd { stroke:var(--d); } .se { stroke:var(--e); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--a)"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="404" rx="10"/>
  <text x="450" y="30" class="t" text-anchor="middle">Above the row budget: the PCPSP LP through its Lagrangian dual</text>
  <text x="160" y="62" class="h" text-anchor="middle">1. price the capacities</text>
  <rect x="30" y="76" width="260" height="150" rx="8" class="card"/>
  <text x="160" y="100" class="h" text-anchor="middle">block b in period t</text>
  <rect x="46" y="114" width="228" height="30" rx="5" class="fb"/>
  <text x="56" y="134" class="m" text-anchor="start">plant  gamma v_bP - mu_r q_rbP</text>
  <rect x="46" y="152" width="228" height="30" rx="5" class="fw"/>
  <text x="56" y="172" class="m" text-anchor="start">dump   gamma v_bD - mu_r q_rbD</text>
  <text x="160" y="206" class="s" text-anchor="middle">g_bt = the larger of the two</text>
  <text x="160" y="246" class="s" text-anchor="middle">a binding plant carries a high price:</text>
  <text x="160" y="262" class="s" text-anchor="middle">marginal ore is worth more dumped</text>
  <text x="440" y="62" class="h" text-anchor="middle">2. one maximum closure</text>
  <circle cx="370" cy="110" r="19" class="fa"/>
  <text x="370" y="114" class="ms" text-anchor="middle">a,1</text>
  <circle cx="370" cy="190" r="19" class="fa"/>
  <text x="370" y="194" class="ms" text-anchor="middle">b,1</text>
  <path d="M370 169 L370 133" class="ar"/>
  <circle cx="440" cy="110" r="19" class="fa"/>
  <text x="440" y="114" class="ms" text-anchor="middle">a,2</text>
  <circle cx="440" cy="190" r="19" class="fa"/>
  <text x="440" y="194" class="ms" text-anchor="middle">b,2</text>
  <path d="M440 169 L440 133" class="ar"/>
  <circle cx="510" cy="110" r="19" class="fa"/>
  <text x="510" y="114" class="ms" text-anchor="middle">a,3</text>
  <circle cx="510" cy="190" r="19" class="fa"/>
  <text x="510" y="194" class="ms" text-anchor="middle">b,3</text>
  <path d="M510 169 L510 133" class="ar"/>
  <path d="M391 110 L417 110" class="ar"/>
  <path d="M391 190 L417 190" class="ar"/>
  <path d="M461 110 L487 110" class="ar"/>
  <path d="M461 190 L487 190" class="ar"/>
  <text x="440" y="230" class="ms" text-anchor="middle">weights g_bt - g_b,t+1 (Abel)</text>
  <text x="440" y="248" class="s" text-anchor="middle">precedence in every period,</text>
  <text x="440" y="264" class="s" text-anchor="middle">monotone in t: compiled max-flow</text>
  <text x="730" y="62" class="h" text-anchor="middle">3. move the prices</text>
  <rect x="600" y="76" width="260" height="50" rx="8" class="fw"/>
  <text x="730.0" y="91.5" class="h" text-anchor="middle">master LP in a trust box</text>
  <text x="730.0" y="108.5" class="s" text-anchor="middle">HiGHS: the next multipliers mu</text>
  <rect x="600" y="150" width="260" height="50" rx="8" class="fw"/>
  <text x="730.0" y="165.5" class="h" text-anchor="middle">closure at mu: L(mu)</text>
  <text x="730.0" y="182.5" class="s" text-anchor="middle">and a subgradient: capacity - use</text>
  <rect x="600" y="224" width="260" height="50" rx="8" class="fw"/>
  <text x="730.0" y="239.5" class="h" text-anchor="middle">add the cut</text>
  <text x="730.0" y="256.5" class="s" text-anchor="middle">serious step: box x2; null step: x0.7</text>
  <path d="M730 128 L730 148" class="ar"/>
  <path d="M730 202 L730 222" class="ar"/>
  <path d="M862 249 L884 249 L884 101 L866 101" class="ar"/>
  <rect x="30" y="292" width="840" height="40" rx="8" class="fc"/>
  <text x="450.0" y="316.0" class="h" text-anchor="middle">stop: within 1e-6 of the model, 40 iterations without a serious step, or 400 iterations; the status is recorded</text>
  <text x="450" y="356" class="s" text-anchor="middle">every mu &gt;= 0 gives a valid bound (the compiled closure rounds weights up); the closure problem is integral,</text>
  <text x="450" y="372" class="s" text-anchor="middle">so the best mu gives the LP value (Geoffrion 1974). Measured on twin-porphyry-s: 316,476,932 by closures in 166 s,</text>
  <text x="450" y="388" class="s" text-anchor="middle">against the HiGHS LP, 316,475,407 in 17.9 minutes: 4.8 parts per million apart.</text>

</svg>
