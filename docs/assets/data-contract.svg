<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 226" role="img" aria-labelledby="t d">
  <title id="t">The two data contracts</title>
  <desc id="d">Raw inputs pass CONTRACT 1, the ladder runs, CONTRACT 2 writes and re-reads the artifacts, the web replays them; CI re-checks the committed evidence.</desc>
  <style>
    :root { --bg:#ffffff; --card:#f6f8fa; --ink:#1f2328; --muted:#59636e; --line:#d0d7de;
            --a:#0969da; --b:#8250df; --c:#1a7f37; --d:#9a6700; --e:#cf222e;
            --a2:#ddf4ff; --b2:#fbefff; --c2:#dafbe1; --d2:#fff8c5; --e2:#ffebe9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --card:#151b23; --ink:#f0f6fc; --muted:#aab4c0; --line:#3d444d;
              --a:#58a6ff; --b:#bc8cff; --c:#3fb950; --d:#e3b341; --e:#ff7b72;
              --a2:#0c2d6b; --b2:#3c1e70; --c2:#04260f; --d2:#3b2300; --e2:#490202; }
    }
    .bg { fill:var(--bg); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .t { fill:var(--ink); font:600 15px system-ui, -apple-system, Segoe UI, sans-serif; }
    .h { fill:var(--ink); font:600 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    .s { fill:var(--muted); font:12px system-ui, -apple-system, Segoe UI, sans-serif; }
    .m { fill:var(--ink); font:12px ui-monospace, Consolas, monospace; }
    .ms { fill:var(--muted); font:11px ui-monospace, Consolas, monospace; }
    .ln { stroke:var(--line); stroke-width:1.5; fill:none; }
    .lnd { stroke:var(--muted); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .ar { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#ah); }
    .ara { stroke:var(--a); stroke-width:1.8; fill:none; marker-end:url(#aha); }
    .fa { fill:var(--a2); stroke:var(--a); stroke-width:1.2; }
    .fb { fill:var(--b2); stroke:var(--b); stroke-width:1.2; }
    .fc { fill:var(--c2); stroke:var(--c); stroke-width:1.2; }
    .fd { fill:var(--d2); stroke:var(--d); stroke-width:1.2; }
    .fe { fill:var(--e2); stroke:var(--e); stroke-width:1.2; }
    .fw { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .ka { fill:var(--a); } .kb { fill:var(--b); } .kc { fill:var(--c); } .kd { fill:var(--d); } .ke { fill:var(--e); }
    .sa { stroke:var(--a); } .sb { stroke:var(--b); } .sc { stroke:var(--c); } .sd { stroke:var(--d); } .se { stroke:var(--e); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--a)"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="226" rx="10"/>
  <text x="480" y="30" class="t" text-anchor="middle">Two contracts: what may enter, what may leave</text>
  <rect x="20" y="70" width="172" height="80" rx="8" class="fw"/>
  <text x="106.0" y="93.0" class="h" text-anchor="middle">raw inputs</text>
  <text x="106.0" y="110.0" class="s" text-anchor="middle">MineLib files (data folder)</text>
  <text x="106.0" y="125.0" class="s" text-anchor="middle">or a seeded twin</text>
  <path d="M194 110 L206 110" class="ar"/>
  <rect x="208" y="70" width="172" height="80" rx="8" class="fc"/>
  <text x="294.0" y="93.0" class="h" text-anchor="middle">CONTRACT 1</text>
  <text x="294.0" y="110.0" class="s" text-anchor="middle">accept / flag / reject</text>
  <text x="294.0" y="125.0" class="s" text-anchor="middle">with reasons</text>
  <path d="M382 110 L394 110" class="ar"/>
  <rect x="396" y="70" width="172" height="80" rx="8" class="fw"/>
  <text x="482.0" y="93.0" class="h" text-anchor="middle">bounds + ladder</text>
  <text x="482.0" y="110.0" class="s" text-anchor="middle">controls, ensemble</text>
  <text x="482.0" y="125.0" class="s" text-anchor="middle">every plan checked</text>
  <path d="M570 110 L582 110" class="ar"/>
  <rect x="584" y="70" width="172" height="80" rx="8" class="fc"/>
  <text x="670.0" y="93.0" class="h" text-anchor="middle">CONTRACT 2</text>
  <text x="670.0" y="110.0" class="s" text-anchor="middle">trace, manifest, index</text>
  <text x="670.0" y="125.0" class="s" text-anchor="middle">re-read and verified</text>
  <path d="M758 110 L770 110" class="ar"/>
  <rect x="772" y="70" width="172" height="80" rx="8" class="fw"/>
  <text x="858.0" y="93.0" class="h" text-anchor="middle">the web</text>
  <text x="858.0" y="110.0" class="s" text-anchor="middle">replay always;</text>
  <text x="858.0" y="125.0" class="s" text-anchor="middle">live re-solve on twins</text>
  <text x="480" y="186" class="s" text-anchor="middle">CI and the deploy re-check the committed evidence: check_artifacts (capacity, bounds, licence, pins), docs_tables --check</text>
  <text x="480" y="206" class="s" text-anchor="middle">a non-redistributable instance never carries per-block data: enforced at bake time and in CI</text>

</svg>
