<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 288" role="img" aria-labelledby="t d">
  <title id="t">Exact and learned paths</title>
  <desc id="d">Top: relaxation, expected times, TopoSort, exact plan. Bottom: features, MLP, predicted times, the same TopoSort, learned plan; compared by their NPV share.</desc>
  <style>
    :root { --bg:#ffffff; --card:#f6f8fa; --ink:#1f2328; --muted:#59636e; --line:#d0d7de;
            --a:#0969da; --b:#8250df; --c:#1a7f37; --d:#9a6700; --e:#cf222e;
            --a2:#ddf4ff; --b2:#fbefff; --c2:#dafbe1; --d2:#fff8c5; --e2:#ffebe9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --card:#151b23; --ink:#f0f6fc; --muted:#aab4c0; --line:#3d444d;
              --a:#58a6ff; --b:#bc8cff; --c:#3fb950; --d:#e3b341; --e:#ff7b72;
              --a2:#0c2d6b; --b2:#3c1e70; --c2:#04260f; --d2:#3b2300; --e2:#490202; }
    }
    .bg { fill:var(--bg); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .t { fill:var(--ink); font:600 15px system-ui, -apple-system, Segoe UI, sans-serif; }
    .h { fill:var(--ink); font:600 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    .s { fill:var(--muted); font:12px system-ui, -apple-system, Segoe UI, sans-serif; }
    .m { fill:var(--ink); font:12px ui-monospace, Consolas, monospace; }
    .ms { fill:var(--muted); font:11px ui-monospace, Consolas, monospace; }
    .ln { stroke:var(--line); stroke-width:1.5; fill:none; }
    .lnd { stroke:var(--muted); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .ar { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#ah); }
    .ara { stroke:var(--a); stroke-width:1.8; fill:none; marker-end:url(#aha); }
    .fa { fill:var(--a2); stroke:var(--a); stroke-width:1.2; }
    .fb { fill:var(--b2); stroke:var(--b); stroke-width:1.2; }
    .fc { fill:var(--c2); stroke:var(--c); stroke-width:1.2; }
    .fd { fill:var(--d2); stroke:var(--d); stroke-width:1.2; }
    .fe { fill:var(--e2); stroke:var(--e); stroke-width:1.2; }
    .fw { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .ka { fill:var(--a); } .kb { fill:var(--b); } .kc { fill:var(--c); } .kd { fill:var(--d); } .ke { fill:var(--e); }
    .sa { stroke:var(--a); } .sb { stroke:var(--b); } .sc { stroke:var(--c); } .sd { stroke:var(--d); } .se { stroke:var(--e); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--a)"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="288" rx="10"/>
  <text x="450" y="30" class="t" text-anchor="middle">Two paths to the same walk: the exact relaxation and the surrogate</text>
  <rect x="30" y="60" width="200" height="60" rx="8" class="fa"/>
  <text x="130.0" y="80.5" class="h" text-anchor="middle">CPIT relaxation</text>
  <text x="130.0" y="97.5" class="s" text-anchor="middle">tens of max closures</text>
  <rect x="270" y="60" width="160" height="60" rx="8" class="fw"/>
  <text x="350.0" y="80.5" class="h" text-anchor="middle">E_b</text>
  <text x="350.0" y="97.5" class="s" text-anchor="middle">expected times</text>
  <rect x="470" y="60" width="180" height="60" rx="8" class="fw"/>
  <text x="560.0" y="80.5" class="h" text-anchor="middle">TopoSort walk</text>
  <text x="560.0" y="97.5" class="s" text-anchor="middle">same code</text>
  <rect x="690" y="60" width="180" height="60" rx="8" class="fc"/>
  <text x="780.0" y="80.5" class="h" text-anchor="middle">exact ExTS plan</text>
  <text x="780.0" y="97.5" class="s" text-anchor="middle">seconds in a worker</text>
  <path d="M232 90 L268 90" class="ar"/>
  <path d="M432 90 L468 90" class="ar"/>
  <path d="M652 90 L688 90" class="ar"/>
  <rect x="30" y="170" width="200" height="60" rx="8" class="fb"/>
  <text x="130.0" y="190.5" class="h" text-anchor="middle">12 block features</text>
  <text x="130.0" y="207.5" class="s" text-anchor="middle">value, cone, depth, scenario</text>
  <rect x="270" y="170" width="160" height="60" rx="8" class="fw"/>
  <text x="350.0" y="190.5" class="h" text-anchor="middle">MLP 11-48-24-1 (x5)</text>
  <text x="350.0" y="207.5" class="s" text-anchor="middle">ReLU, sigmoid head</text>
  <rect x="470" y="170" width="180" height="60" rx="8" class="fw"/>
  <text x="560.0" y="190.5" class="h" text-anchor="middle">TopoSort walk</text>
  <text x="560.0" y="207.5" class="s" text-anchor="middle">same code</text>
  <rect x="690" y="170" width="180" height="60" rx="8" class="fd"/>
  <text x="780.0" y="190.5" class="h" text-anchor="middle">learned plan</text>
  <text x="780.0" y="207.5" class="s" text-anchor="middle">in 0.1 to 0.25 s</text>
  <path d="M232 200 L268 200" class="ar"/>
  <path d="M432 200 L468 200" class="ar"/>
  <path d="M652 200 L688 200" class="ar"/>
  <path d="M780 168 L780 124" class="lnd"/>
  <text x="770" y="150" class="ms" text-anchor="end">share = NPV(learned) / NPV(exact)</text>
  <text x="450" y="268" class="s" text-anchor="middle">split by deposit seed; scored on the plan it produces, on deposits it never saw; it never certifies a bound</text>

</svg>
