<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Time-expanded graph and the BZ loop</title>
  <desc id="d">Left: a two-block, three-period time-expanded graph with precedence and monotonicity arcs. Right: the column-generation loop of Bienstock-Zuckerberg with max-closure pricing and a final exact certification.</desc>
  <style>
    :root { --bg:#ffffff; --card:#f6f8fa; --ink:#1f2328; --muted:#59636e; --line:#d0d7de;
            --a:#0969da; --b:#8250df; --c:#1a7f37; --d:#9a6700; --e:#cf222e;
            --a2:#ddf4ff; --b2:#fbefff; --c2:#dafbe1; --d2:#fff8c5; --e2:#ffebe9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --card:#151b23; --ink:#f0f6fc; --muted:#aab4c0; --line:#3d444d;
              --a:#58a6ff; --b:#bc8cff; --c:#3fb950; --d:#e3b341; --e:#ff7b72;
              --a2:#0c2d6b; --b2:#3c1e70; --c2:#04260f; --d2:#3b2300; --e2:#490202; }
    }
    .bg { fill:var(--bg); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .t { fill:var(--ink); font:600 15px system-ui, -apple-system, Segoe UI, sans-serif; }
    .h { fill:var(--ink); font:600 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    .s { fill:var(--muted); font:12px system-ui, -apple-system, Segoe UI, sans-serif; }
    .m { fill:var(--ink); font:12px ui-monospace, Consolas, monospace; }
    .ms { fill:var(--muted); font:11px ui-monospace, Consolas, monospace; }
    .ln { stroke:var(--line); stroke-width:1.5; fill:none; }
    .lnd { stroke:var(--muted); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .ar { stroke:var(--muted); stroke-width:1.6; fill:none; marker-end:url(#ah); }
    .ara { stroke:var(--a); stroke-width:1.8; fill:none; marker-end:url(#aha); }
    .fa { fill:var(--a2); stroke:var(--a); stroke-width:1.2; }
    .fb { fill:var(--b2); stroke:var(--b); stroke-width:1.2; }
    .fc { fill:var(--c2); stroke:var(--c); stroke-width:1.2; }
    .fd { fill:var(--d2); stroke:var(--d); stroke-width:1.2; }
    .fe { fill:var(--e2); stroke:var(--e); stroke-width:1.2; }
    .fw { fill:var(--card); stroke:var(--line); stroke-width:1; }
    .ka { fill:var(--a); } .kb { fill:var(--b); } .kc { fill:var(--c); } .kd { fill:var(--d); } .ke { fill:var(--e); }
    .sa { stroke:var(--a); } .sb { stroke:var(--b); } .sc { stroke:var(--c); } .sd { stroke:var(--d); } .se { stroke:var(--e); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--a)"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="360" rx="10"/>
  <text x="450" y="30" class="t" text-anchor="middle">Bienstock-Zuckerberg on the time-expanded graph</text>
  <circle cx="60" cy="90" r="20" class="fa"/>
  <text x="60" y="94" class="ms" text-anchor="middle">a,1</text>
  <circle cx="60" cy="180" r="20" class="fa"/>
  <text x="60" y="184" class="ms" text-anchor="middle">b,1</text>
  <path d="M60 158 L60 114" class="ar"/>
  <circle cx="150" cy="90" r="20" class="fa"/>
  <text x="150" y="94" class="ms" text-anchor="middle">a,2</text>
  <circle cx="150" cy="180" r="20" class="fa"/>
  <text x="150" y="184" class="ms" text-anchor="middle">b,2</text>
  <path d="M150 158 L150 114" class="ar"/>
  <circle cx="240" cy="90" r="20" class="fa"/>
  <text x="240" y="94" class="ms" text-anchor="middle">a,3</text>
  <circle cx="240" cy="180" r="20" class="fa"/>
  <text x="240" y="184" class="ms" text-anchor="middle">b,3</text>
  <path d="M240 158 L240 114" class="ar"/>
  <path d="M82 90 L126 90" class="ar"/>
  <path d="M82 180 L126 180" class="ar"/>
  <path d="M172 90 L216 90" class="ar"/>
  <path d="M172 180 L216 180" class="ar"/>
  <text x="150" y="245" class="s" text-anchor="middle">node (b, t) = x_bt; vertical: precedence</text>
  <text x="150" y="262" class="s" text-anchor="middle">in every period; horizontal: monotonicity</text>
  <text x="150" y="286" class="ms" text-anchor="middle">capacity rows: +1 on t, -1 on t - 1</text>
  <rect x="360" y="60" width="220" height="62" rx="8" class="fw"/>
  <text x="470.0" y="81.5" class="h" text-anchor="middle">restricted master LP</text>
  <text x="470.0" y="98.5" class="s" text-anchor="middle">variables equated on a partition</text>
  <rect x="660" y="60" width="220" height="62" rx="8" class="fw"/>
  <text x="770.0" y="81.5" class="h" text-anchor="middle">pricing: one max closure</text>
  <text x="770.0" y="98.5" class="s" text-anchor="middle">values c - pi H, a min cut</text>
  <rect x="660" y="170" width="220" height="62" rx="8" class="fw"/>
  <text x="770.0" y="191.5" class="h" text-anchor="middle">refine the partition</text>
  <text x="770.0" y="208.5" class="s" text-anchor="middle">AND / MINUS with the new set</text>
  <rect x="360" y="170" width="220" height="62" rx="8" class="fw"/>
  <text x="470.0" y="191.5" class="h" text-anchor="middle">stop: no positive reduced profit</text>
  <text x="470.0" y="208.5" class="s" text-anchor="middle">coarsen only after improvement</text>
  <path d="M582 91 L658 91" class="ar"/>
  <text x="620" y="83" class="ms" text-anchor="middle">duals pi</text>
  <path d="M770 124 L770 168" class="ar"/>
  <path d="M658 201 L582 201" class="ar"/>
  <path d="M470 168 L470 124" class="ar"/>
  <rect x="360" y="262" width="520" height="50" rx="8" class="fc"/>
  <text x="620.0" y="291.0" class="h" text-anchor="middle">certify: one EXACT closure at the final dual vector</text>
  <text x="450" y="340" class="s" text-anchor="middle">Z_BZ = Z_LP (precedence is totally unimodular): the same bound, where a general solver gives none</text>

</svg>
