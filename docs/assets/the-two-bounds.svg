<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 405" role="img"
     aria-labelledby="gap-title gap-desc">
  <title id="gap-title">Newman1: the two bounds, integer optimum, and PhaseFlow schedule</title>
  <desc id="gap-desc">Four value levels. Algorithm 4 is 24,487,410.43; the PhaseFlow joint LP
    bound is 24,486,184.09; an external AMPL notebook reports an integer optimum of 24,176,864.82;
    PhaseFlow's sliding-window schedule is 24,149,869.40. The three differences are bound
    looseness, LP integrality gap, and feasible-method shortfall. Spacing is schematic.</desc>
  <style>
    :root { --bg: #f6f8fa; --card: #fff; --ink: #1f2328; --muted: #59636e;
            --line: #d0d7de; --a4: #a16a00; --lp: #0969da; --opt: #8250df; --plan: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --card: #151b23; --ink: #f0f6fc; --muted: #aab4c0;
              --line: #3d444d; --a4: #e3b341; --lp: #58a6ff; --opt: #bc8cff; --plan: #3fb950; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
    .title { fill: var(--ink); font: 600 15px system-ui, sans-serif; }
    .sub { fill: var(--muted); font: 12px system-ui, sans-serif; }
    .value { fill: var(--ink); font: 600 16px ui-monospace, Consolas, monospace; }
    .delta { fill: var(--muted); font: 12px ui-monospace, Consolas, monospace; }
    .rule { stroke: var(--line); stroke-width: 1.5; }
    .a4 { fill: var(--a4); } .lp { fill: var(--lp); }
    .opt { fill: var(--opt); } .plan { fill: var(--plan); }
  </style>
  <rect class="bg" width="920" height="405" rx="10"/>

  <rect class="card" x="18" y="20" width="884" height="62" rx="8"/>
  <rect class="a4" x="18" y="20" width="6" height="62" rx="3"/>
  <text class="title" x="42" y="46">Algorithm 4 upper bound</text>
  <text class="sub" x="42" y="66">One resource relaxed at a time; certified upper bound</text>
  <text class="value" x="878" y="56" text-anchor="end">24,487,410.43</text>

  <line class="rule" x1="48" y1="83" x2="48" y2="102"/>
  <text class="delta" x="66" y="97">1,226.34: looseness removed by the joint LP solve</text>

  <rect class="card" x="18" y="104" width="884" height="62" rx="8"/>
  <rect class="lp" x="18" y="104" width="6" height="62" rx="3"/>
  <text class="title" x="42" y="130">Joint CPIT LP bound</text>
  <text class="sub" x="42" y="150">PhaseFlow Bienstock-Zuckerberg result; still a relaxation</text>
  <text class="value" x="878" y="140" text-anchor="end">24,486,184.09</text>

  <line class="rule" x1="48" y1="167" x2="48" y2="186"/>
  <text class="delta" x="66" y="181">309,319.27: LP integrality gap on this instance</text>

  <rect class="card" x="18" y="188" width="884" height="62" rx="8"/>
  <rect class="opt" x="18" y="188" width="6" height="62" rx="3"/>
  <text class="title" x="42" y="214">Integer optimum</text>
  <text class="sub" x="42" y="234">External AMPL / Gurobi notebook; not a PhaseFlow certificate</text>
  <text class="value" x="878" y="224" text-anchor="end">24,176,864.82</text>

  <line class="rule" x1="48" y1="251" x2="48" y2="270"/>
  <text class="delta" x="66" y="265">26,995.42: PhaseFlow feasible-method shortfall</text>

  <rect class="card" x="18" y="272" width="884" height="62" rx="8"/>
  <rect class="plan" x="18" y="272" width="6" height="62" rx="3"/>
  <text class="title" x="42" y="298">PhaseFlow sliding-window schedule</text>
  <text class="sub" x="42" y="318">Feasible on the published six-period CPIT scenario</text>
  <text class="value" x="878" y="308" text-anchor="end">24,149,869.40</text>

  <text class="sub" x="22" y="365">Value differences add in money units; percent gaps have different denominators.</text>
  <text class="sub" x="22" y="384">Levels are schematic, with no proportional vertical scale. Sources: PhaseFlow artifact and AMPL Colaboratory.</text>
</svg>
