name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the frontend and schema validator
        run: cd frontend && npm ci && cd .. && pip install jsonschema==4.26.0
      - name: Lint the offline pipeline, tests, and repository scripts
        run: pip install ruff==0.15.18 && ruff check data-pipeline tests scripts
      - name: The workflows parse
        run: |
          pip install pyyaml==6.0.3
          python -c "import pathlib, yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]; print('workflows: OK')"
      - name: CONTRACT 2, manifests and artifacts consistent
        run: python scripts/check_artifacts.py
      - name: Version is coherent with the latest release tag
        run: python scripts/check_version_coherence.py
      - name: SDD requirements have real gates
        run: python scripts/check_sdd.py
      - name: Static notebook structure and measured quality bar
        run: python scripts/check_notebooks.py
      - name: Product manuscripts are declared and versioned
        run: python scripts/check_manuscripts.py
      - name: README areas, notebook mirror and documentation links
        run: python scripts/check_readme_areas.py && python scripts/check_doc_paths.py
      - name: Theme-aware SVGs and accessible animation limits
        run: python scripts/check_svg_animation.py
      - name: Deployment target and dependency matrix
        run: python scripts/check_deploy_place.py && python scripts/check_tech_matrix.py
      - name: Versioned data contracts match their schemas and history
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "${base//0/}" ]; then base=origin/develop; fi
          python scripts/check_contract_versions.py --base "$base"
      - name: Adversarial guard tests
        run: pip install pytest==9.1.1 && python -m pytest tests/adversarial -q
      - name: Contract catalog, schema documents and release readiness
        run: python scripts/check_contracts.py docs/contracts/catalog.md --repo-root . && python scripts/check_documents.py && python scripts/check_readiness.py
      - name: No provider-backed contracts on a release
        run: |
          set +e
          python scripts/check_skeleton.py docs/contracts/catalog.md
          code=$?
          set -e
          if [ "$code" -eq 2 ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::main is a release: every catalog row must be real"; exit 1; fi
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: cd frontend && npm ci
      - name: Build the six-route app and materialise the Pages routes
        run: cd frontend && npm run build
      - name: Frontend unit, contract, and engine parity tests
        run: cd frontend && npm test
      - name: Public method language follows the current content rule
        run: cd frontend && npm run check:method-language
      - name: Shared shell baseline and product overrides
        run: python scripts/check_web_baseline.py

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Base integrity, template residue, and document paths
        run: python scripts/check_base_integrity.py && python scripts/check_template_residue.py && python scripts/check_doc_paths.py
      - name: Bilingual content standards and tracked shell scripts
        run: |
          python scripts/check_content_standards.py
          bad=$(git ls-files -s -- '*.sh' | grep '^100644' || true)
          if [ -n "$bad" ]; then echo "::error::tracked shell scripts must be executable"; echo "$bad"; exit 1; fi
      - name: Generated documentation, README facts, and CI budget
        run: python scripts/docs_tables.py --check && python scripts/check_readme_numbers.py && python scripts/check_ci_budget.py
